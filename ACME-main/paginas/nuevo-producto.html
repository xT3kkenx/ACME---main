
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACME - Nuevo producto</title>

  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <!-- =====================================================
       ENCABEZADO Y MENÚ PRINCIPAL
       ===================================================== -->

  <header class="main-header">

<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="page-container">

    <section>

      <h2>Formulario de nuevo producto</h2>

      <div class="form-container">

        <!--
          El envío ya NO se hace por action="#": producto-form.js intercepta
          el evento "submit", valida los campos y guarda en localStorage.
          Por eso quitamos action/method/enctype, que no cumplen ninguna
          función real sin un servidor detrás.
        -->
        <form id="form-producto" novalidate>

          <!-- CÓDIGO -->

          <div class="form-group">
            <label for="codigo">Código del producto</label>
            <input
              type="text"
              id="codigo"
              name="codigo"
              placeholder="Ej. FER-001">
            <span class="field-error" id="error-codigo"></span>
          </div>


          <!-- NOMBRE -->

          <div class="form-group">
            <label for="nombre">Nombre del producto</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ingrese el nombre del producto">
            <span class="field-error" id="error-nombre"></span>
          </div>


          <!-- CATEGORÍA -->

          <div class="form-group">
            <label for="categoria">Categoría</label>

            <select id="categoria" name="categoria">
              <option value="">Seleccione una categoría</option>
              <option value="ferreteria">Ferretería</option>
              <option value="pinturas">Pinturas</option>
              <option value="fontaneria">Fontanería</option>
              <option value="construccion">Construcción</option>
              <option value="adhesivos">Adhesivos</option>
              <option value="seguridad">Seguridad</option>
              <option value="herramientas">Herramientas</option>
              <option value="electricidad">Electricidad</option>
            </select>
            <span class="field-error" id="error-categoria"></span>

          </div>


          <!-- UBICACIÓN -->

          <div class="form-group">
            <label for="ubicacion">Ubicación</label>

            <select id="ubicacion" name="ubicacion">
              <option value="">Seleccione una ubicación</option>
              <option value="vitrina">Vitrina</option>
              <option value="bodega">Bodega</option>
            </select>
            <span class="field-error" id="error-ubicacion"></span>

          </div>


          <!-- DESCRIPCIÓN -->

          <div class="form-group">
            <label for="descripcion">Descripción</label>

            <textarea
              id="descripcion"
              name="descripcion"
              rows="4"
              placeholder="Ingrese una descripción del producto"></textarea>

          </div>


          <!-- PRECIO DE ENTRADA -->

          <div class="form-group">
            <label for="precioEntrada">Precio de entrada</label>

            <input
              type="number"
              id="precioEntrada"
              name="precioEntrada"
              min="0"
              step="0.01"
              placeholder="0.00">
            <span class="field-error" id="error-precioEntrada"></span>

          </div>


          <!-- PRECIO DE SALIDA -->

          <div class="form-group">
            <label for="precioSalida">Precio de salida</label>

            <input
              type="number"
              id="precioSalida"
              name="precioSalida"
              min="0"
              step="0.01"
              placeholder="0.00">
            <span class="field-error" id="error-precioSalida"></span>

          </div>


          <!-- UNIDAD -->

          <div class="form-group">
            <label for="unidad">Unidad</label>

            <input
              type="text"
              id="unidad"
              name="unidad"
              placeholder="Ej. Unidad, Kg, Litro">
            <span class="field-error" id="error-unidad"></span>

          </div>


          <!-- PRESENTACIÓN -->

          <div class="form-group">
            <label for="presentacion">Presentación</label>

            <input
              type="text"
              id="presentacion"
              name="presentacion"
              placeholder="Ej. Caja x 12 unidades">

          </div>


          <!-- CANTIDAD DISPONIBLE -->

          <div class="form-group">
            <label for="cantidad">Cantidad disponible</label>

            <input
              type="number"
              id="cantidad"
              name="cantidad"
              min="0"
              placeholder="0">
            <span class="field-error" id="error-cantidad"></span>

          </div>


          <!-- CANTIDAD MÍNIMA -->

          <div class="form-group">
            <label for="minima">Cantidad mínima disponible</label>

            <input
              type="number"
              id="minima"
              name="minima"
              min="0"
              placeholder="0">
            <span class="field-error" id="error-minima"></span>

          </div>


          <!-- IMAGEN -->

          <div class="form-group">
            <label for="imagen">Imagen del producto</label>

            <input
              type="file"
              id="imagen"
              name="imagen"
              accept="image/*">
            <small class="ayuda-campo">Si estás editando y no eliges una imagen nueva, se conserva la actual.</small>

          </div>


          <!-- BOTONES -->

          <div class="form-row">

            <button type="submit" class="btn-primary">
              Guardar producto
            </button>

            <a href="productos.html" class="btn-secondary btn-cancelar">
              Cancelar
            </a>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FUNCIONALIDAD DEL MENÚ RESPONSIVO
       ===================================================== -->

  <script>

    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

  </script>

  <!-- MÓDULO DE DATOS (localStorage) Y LÓGICA DE ESTE FORMULARIO -->
  <!-- (crea Y edita productos; ver comentarios dentro de producto-form.js) -->
  <script src="../js/storage.js"></script>
  <script src="../js/utilidades.js"></script>
  <script src="../js/producto-form.js"></script>

</body>

</html>
