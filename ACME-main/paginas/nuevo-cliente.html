<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACME - Nuevo cliente</title>

  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <!-- ENCABEZADO Y MENÚ PRINCIPAL-->

  <header class="main-header">
    
<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>


  <!-- CONTENIDO PRINCIPAL-->

  <main class="page-container">

    <section>

      <h2>Formulario de nuevo cliente</h2>

      <div class="form-container">

        <form id="form-cliente" novalidate>

          <!-- NOMBRE -->

          <div class="form-group">

            <label for="nombre">Nombre</label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ingrese el nombre">
            <span class="field-error" id="error-nombre"></span>

          </div>


          <!-- APELLIDO -->

          <div class="form-group">

            <label for="apellido">Apellido</label>

            <input
              type="text"
              id="apellido"
              name="apellido"
              placeholder="Ingrese el apellido">
            <span class="field-error" id="error-apellido"></span>

          </div>


          <!-- DIRECCIÓN -->

          <div class="form-group">

            <label for="direccion">Dirección</label>

            <input
              type="text"
              id="direccion"
              name="direccion"
              placeholder="Ingrese la dirección">
            <span class="field-error" id="error-direccion"></span>

          </div>


          <!-- CORREO -->

          <div class="form-group">

            <label for="correo">Correo electrónico</label>

            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="ejemplo@correo.com">
            <span class="field-error" id="error-correo"></span>

          </div>


          <!-- TELÉFONO -->

          <div class="form-group">

            <label for="telefono">Teléfono</label>

            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ingrese el número de teléfono">
            <span class="field-error" id="error-telefono"></span>

          </div>


          <!-- BOTONES -->

          <div class="form-row">

            <button type="submit" class="btn-primary">
              Guardar cliente
            </button>

            <a href="clientes.html" class="btn-secondary btn-cancelar">
              Cancelar
            </a>

          </div>

        </form>

      </div>

    </section>

  </main>


  <!-- FUNCIONALIDAD DEL MENÚ RESPONSIVO -->

  <script>

    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

  </script>

  <!-- MÓDULO DE DATOS (localStorage) Y LÓGICA DE ESTE FORMULARIO -->
  <script src="../js/storage.js"></script>
  <script src="../js/utilidades.js"></script>
  <script src="../js/cliente-form.js"></script>

</body>

</html>
