
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACME - Proveedores</title>

  <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

  <!-- =====================================================
       ENCABEZADO Y MENÚ PRINCIPAL
       ===================================================== -->

  <header class="main-header">

<a href="inicio.html" class="header-logo">
  <img src="../img/logo-acme.png" alt="Logo de Comercializadora ACME S.A.S.">
</a>

    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="main-nav">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="proveedores.html">Proveedores</a></li>
        <li><a href="ordenes.html">Órdenes</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="compras.html">Compras</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="page-container">

    <section>

      <h2>Lista de proveedores</h2>

      <!-- BOTÓN NUEVO PROVEEDOR -->

      <p>
        <a href="nuevo-proveedor.html" class="btn-primary">
          Nuevo proveedor
        </a>
      </p>

    </section>


    <!-- BUSCADOR: filtra la tabla en tiempo real por nombre o contacto -->

    <section>

      <div class="form-group buscador-group">
        <label for="buscador-proveedores">Buscar proveedor</label>
        <input
          type="search"
          id="buscador-proveedores"
          placeholder="Buscar por nombre o contacto...">
      </div>

    </section>


    <!-- =================================================
         TABLA DE PROVEEDORES
         El <tbody> se llena dinámicamente desde js/proveedores.js
         ================================================= -->

    <section>

      <div class="table-container">

        <table id="tabla-proveedores">

          <thead>
            <tr>
              <th>Nombre</th>
              <th>Contacto</th>
              <th>Dirección</th>
              <th>Correo</th>
              <th>Teléfono</th>
            </tr>
          </thead>

          <tbody>
            <!-- Filas generadas por JavaScript -->
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FUNCIONALIDAD DEL MENÚ RESPONSIVO
       ===================================================== -->

  <script>

    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

  </script>

  <!-- MÓDULO DE DATOS (localStorage) Y LÓGICA DE ESTA PÁGINA -->
  <script src="../js/storage.js"></script>
  <script src="../js/utilidades.js"></script>
  <script src="../js/proveedores.js"></script>

</body>

</html>
